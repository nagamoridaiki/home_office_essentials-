<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img"><title>販売注文の状態遷移</title><desc>Stripe の Webhook 受信で注文確定が作られ、発送済、配送完了と進む。発送後にキャンセルへ戻す遷移は禁止。</desc>
<style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Noto Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Droid Sans Fallback",sans-serif}
.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#04342C}.c-teal>.ts{fill:#0F6E56}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#26215C}.c-purple>.ts{fill:#534AB7}
.ng{stroke:#E24B4A;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>
<circle class="c-gray" cx="100" cy="36" r="6" stroke-width="0.5"/>
<g class="c-teal"><rect x="40" y="70" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="93">注文確定</text><text class="ts" x="52" y="109">confirmed</text></g>
<g class="c-teal"><rect x="40" y="170" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="193">発送済</text><text class="ts" x="52" y="209">shipped</text></g>
<g class="c-purple"><rect x="40" y="270" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="293">配送完了</text><text class="ts" x="52" y="309">delivered</text></g>
<g class="c-gray"><rect x="240" y="70" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="252" y="93">キャンセル</text><text class="ts" x="252" y="109">canceled</text></g>
<g class="c-gray"><rect x="240" y="270" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="252" y="293">返金済</text><text class="ts" x="252" y="309">refunded</text></g>
<line class="arr" x1="100" y1="44" x2="100" y2="68" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="116" x2="100" y2="168" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="216" x2="100" y2="268" marker-end="url(#arrow)"/>
<line class="arr" x1="192" y1="93" x2="238" y2="93" marker-end="url(#arrow)"/>
<line class="arr" x1="192" y1="293" x2="238" y2="293" marker-end="url(#arrow)"/>
<path class="ng" d="M190 193 H458 V93 H392" marker-end="url(#arrow)"/>
<text class="ts" x="115" y="40">Stripe Webhook 受信でのみ作成</text>
<text class="ts" x="160" y="147">送り状発行・追跡番号を保存</text>
<text class="ts" x="160" y="247">配送完了を記録</text>
<text class="ts" x="470" y="150" fill="#A32D2D">発送後は返金済へ</text>
<line class="arr" x1="40" y1="346" x2="70" y2="346"/>
<text class="ts" x="78" y="350">許可</text>
<line class="ng" x1="130" y1="346" x2="160" y2="346"/>
<text class="ts" x="168" y="350">禁止（実装しない）</text>
</svg>

<text class="ts" x="78" y="1053">1:1</text>
<text class="ts" x="40" y="1792">customer_id は customers（認証の図）を参照する</text>
<text class="ts" x="40" y="1810">selling_order_items.inventory_id は inventories（在庫の図）を 1:1 で参照する</text>
<text class="ts" x="40" y="1828">stripe_webhook_events はどのテーブルとも外部キーで結ばない</text>
<text class="ts" x="40" y="1854">PK 主キー　FK 外部キー　U UNIQUE　可 NULL 可</text>
<text class="ts" x="40" y="1872">created_at / updated_at は全テーブル共通のため省略</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>在庫の状態遷移</title><desc>準備中から販売可、確保中を経て売却済に至る在庫の状態遷移。販売可から確保中を飛ばして売却済にする遷移は禁止。</desc>
<style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Noto Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Droid Sans Fallback",sans-serif}
.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#04342C}.c-teal>.ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#412402}.c-amber>.ts{fill:#854F0B}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#26215C}.c-purple>.ts{fill:#534AB7}
.ng{stroke:#E24B4A;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>
<g class="c-gray"><rect x="40" y="60" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="83">準備中</text><text class="ts" x="52" y="99">preparing</text></g>
<g class="c-teal"><rect x="40" y="160" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="183">販売可</text><text class="ts" x="52" y="199">available</text></g>
<g class="c-amber"><rect x="40" y="260" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="283">確保中</text><text class="ts" x="52" y="299">locked</text></g>
<g class="c-purple"><rect x="40" y="360" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="383">売却済</text><text class="ts" x="52" y="399">sold</text></g>
<g class="c-gray"><rect x="460" y="160" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="472" y="183">出品停止</text><text class="ts" x="472" y="199">suspended</text></g>
<g class="c-gray"><rect x="460" y="260" width="150" height="46" rx="4" stroke-width="0.5"/><text class="th" x="472" y="283">廃棄</text><text class="ts" x="472" y="299">discarded</text></g>
<line class="arr" x1="100" y1="106" x2="100" y2="158" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="206" x2="100" y2="258" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="306" x2="100" y2="358" marker-end="url(#arrow)"/>
<line class="arr" x1="145" y1="258" x2="145" y2="208" marker-end="url(#arrow)"/>
<line class="arr" x1="192" y1="172" x2="458" y2="172" marker-end="url(#arrow)"/>
<line class="arr" x1="458" y1="188" x2="192" y2="188" marker-end="url(#arrow)"/>
<line class="arr" x1="535" y1="206" x2="535" y2="258" marker-end="url(#arrow)"/>
<path class="arr" d="M190 83 H630 V283 H612" marker-end="url(#arrow)"/>
<path class="ng" d="M190 200 H420 V383 H192" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="137">出品する</text>
<text class="ts" x="160" y="225">購入手続きへ（15分ロック）</text>
<text class="ts" x="160" y="245">期限切れ・決済失敗で解放</text>
<text class="ts" x="160" y="337">Stripe Webhook 受信で確定</text>
<text class="ts" x="432" y="345" fill="#A32D2D">ロックを飛ばせない</text>
<line class="arr" x1="40" y1="436" x2="70" y2="436"/>
<text class="ts" x="78" y="440">許可</text>
<line class="ng" x1="130" y1="436" x2="160" y2="436"/>
<text class="ts" x="168" y="440">禁止（実装しない）</text>
</svg>

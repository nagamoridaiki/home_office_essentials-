<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1156" viewBox="0 0 680 1156" role="img"><title>ER 図 カタログと在庫</title><desc>カテゴリが販売枠を分類し、販売枠に在庫個体がN点紐づく。在庫のソフトロックは専用テーブルではなく在庫の2列で持つ。</desc>
<style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Hiragino Sans",system-ui,sans-serif}
.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#2C2C2A}
.key{font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1156" fill="#FFFFFF"/>
<rect x="130" y="50" width="420" height="128" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="130" y="50" width="420" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="142" y="69" fill="#2C2C2A">categories</text>
<text class="ts" x="538" y="69" fill="#5F5E5A" text-anchor="end">カテゴリ</text>
<text class="mono" xml:space="preserve" x="142" y="96">id                        bigint       </text>
<text class="key" xml:space="preserve" x="422" y="96">PK</text>
<text class="mono" xml:space="preserve" x="142" y="114">name                      text         </text>
<text class="mono" xml:space="preserve" x="142" y="132">slug                      text         </text>
<text class="key" xml:space="preserve" x="422" y="132">U</text>
<text class="mono" xml:space="preserve" x="142" y="150">parent_id                 bigint       </text>
<text class="key" xml:space="preserve" x="422" y="150">FK 可</text>
<text class="mono" xml:space="preserve" x="142" y="168">display_order             integer      </text>
<rect x="130" y="214" width="420" height="200" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="130" y="214" width="420" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="142" y="233" fill="#04342C">selling_products</text>
<text class="ts" x="538" y="233" fill="#0F6E56" text-anchor="end">販売枠</text>
<text class="mono" xml:space="preserve" x="142" y="260">id                        bigint       </text>
<text class="key" xml:space="preserve" x="422" y="260">PK</text>
<text class="mono" xml:space="preserve" x="142" y="278">category_id               bigint       </text>
<text class="key" xml:space="preserve" x="422" y="278">FK</text>
<text class="mono" xml:space="preserve" x="142" y="296">name                      text         </text>
<text class="mono" xml:space="preserve" x="142" y="314">model_number              text         </text>
<text class="mono" xml:space="preserve" x="142" y="332">product_condition         text         </text>
<text class="mono" xml:space="preserve" x="142" y="350">condition_rank            text         </text>
<text class="key" xml:space="preserve" x="422" y="350">可</text>
<text class="mono" xml:space="preserve" x="142" y="368">selling_price             bigint       </text>
<text class="mono" xml:space="preserve" x="142" y="386">description               text         </text>
<text class="mono" xml:space="preserve" x="142" y="404">listing_status            text         </text>
<rect x="130" y="450" width="420" height="128" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="130" y="450" width="420" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="142" y="469" fill="#2C2C2A">selling_product_images</text>
<text class="ts" x="538" y="469" fill="#5F5E5A" text-anchor="end">商品画像</text>
<text class="mono" xml:space="preserve" x="142" y="496">id                        bigint       </text>
<text class="key" xml:space="preserve" x="422" y="496">PK</text>
<text class="mono" xml:space="preserve" x="142" y="514">selling_product_id        bigint       </text>
<text class="key" xml:space="preserve" x="422" y="514">FK</text>
<text class="mono" xml:space="preserve" x="142" y="532">image_url                 text         </text>
<text class="mono" xml:space="preserve" x="142" y="550">display_order             integer      </text>
<text class="key" xml:space="preserve" x="422" y="550">U</text>
<text class="mono" xml:space="preserve" x="142" y="568">alt_text                  text         </text>
<text class="key" xml:space="preserve" x="422" y="568">可</text>
<rect x="130" y="614" width="420" height="236" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="130" y="614" width="420" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="142" y="633" fill="#04342C">inventories</text>
<text class="ts" x="538" y="633" fill="#0F6E56" text-anchor="end">在庫（個体 1 点）</text>
<text class="mono" xml:space="preserve" x="142" y="660">id                        bigint       </text>
<text class="key" xml:space="preserve" x="422" y="660">PK</text>
<text class="mono" xml:space="preserve" x="142" y="678">selling_product_id        bigint       </text>
<text class="key" xml:space="preserve" x="422" y="678">FK 可</text>
<text class="mono" xml:space="preserve" x="142" y="696">purchase_order_id         bigint       </text>
<text class="key" xml:space="preserve" x="422" y="696">FK U 可</text>
<text class="mono" xml:space="preserve" x="142" y="714">inventory_status          text         </text>
<text class="mono" xml:space="preserve" x="142" y="732">condition_rank            text         </text>
<text class="key" xml:space="preserve" x="422" y="732">可</text>
<text class="mono" xml:space="preserve" x="142" y="750">cost_price                bigint       </text>
<text class="mono" xml:space="preserve" x="142" y="768">storage_location          text         </text>
<text class="key" xml:space="preserve" x="422" y="768">可</text>
<text class="mono" xml:space="preserve" x="142" y="786">lock_checkout_session_id  bigint       </text>
<text class="key" xml:space="preserve" x="422" y="786">FK 可</text>
<text class="mono" xml:space="preserve" x="142" y="804">lock_expires_at           timestamptz  </text>
<text class="key" xml:space="preserve" x="422" y="804">可</text>
<text class="mono" xml:space="preserve" x="142" y="822">sold_at                   timestamptz  </text>
<text class="key" xml:space="preserve" x="422" y="822">可</text>
<text class="mono" xml:space="preserve" x="142" y="840">discard_reason            text         </text>
<text class="key" xml:space="preserve" x="422" y="840">可</text>
<rect x="130" y="886" width="420" height="164" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="130" y="886" width="420" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="142" y="905" fill="#2C2C2A">inventory_movements</text>
<text class="ts" x="538" y="905" fill="#5F5E5A" text-anchor="end">在庫変動履歴</text>
<text class="mono" xml:space="preserve" x="142" y="932">id                        bigint       </text>
<text class="key" xml:space="preserve" x="422" y="932">PK</text>
<text class="mono" xml:space="preserve" x="142" y="950">inventory_id              bigint       </text>
<text class="key" xml:space="preserve" x="422" y="950">FK</text>
<text class="mono" xml:space="preserve" x="142" y="968">movement_type             text         </text>
<text class="mono" xml:space="preserve" x="142" y="986">selling_order_id          bigint       </text>
<text class="key" xml:space="preserve" x="422" y="986">FK 可</text>
<text class="mono" xml:space="preserve" x="142" y="1004">purchase_order_id         bigint       </text>
<text class="key" xml:space="preserve" x="422" y="1004">FK 可</text>
<text class="mono" xml:space="preserve" x="142" y="1022">admin_id                  bigint       </text>
<text class="key" xml:space="preserve" x="422" y="1022">FK 可</text>
<text class="mono" xml:space="preserve" x="142" y="1040">note                      text         </text>
<text class="key" xml:space="preserve" x="422" y="1040">可</text>
<line class="arr" x1="340" y1="180" x2="340" y2="212" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="200">1:N</text>
<line class="arr" x1="340" y1="416" x2="340" y2="448" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="436">1:N</text>
<path class="arr" d="M130 314 H100 V732 H128" marker-end="url(#arrow)"/>
<text class="ts" x="108" y="523">1:N</text>
<line class="arr" x1="340" y1="852" x2="340" y2="884" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="872">1:N</text>
<path class="arr" d="M550 114 H590 V142 H552" marker-end="url(#arrow)"/>
<text class="ts" x="556" y="106">自己参照</text>
<text class="ts" x="40" y="1084">inventories.lock_checkout_session_id は checkout_sessions（販売の図）を参照する</text>
<text class="ts" x="40" y="1102">inventories.purchase_order_id は purchase_orders（買取の図）を 1:1 で参照する</text>
<text class="ts" x="40" y="1128">PK 主キー　FK 外部キー　U UNIQUE　可 NULL 可</text>
<text class="ts" x="40" y="1146">created_at / updated_at は全テーブル共通のため省略</text>
</svg>

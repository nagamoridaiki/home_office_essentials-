<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img"><title>買取注文の状態遷移</title><desc>依頼受付から写真査定、本人確認、集荷、倉庫到着、実物検品、合意、送金へ進む買取の流れ。合意を飛ばして送金する遷移は禁止。</desc>
<style>text{font-family:"Noto Sans CJK JP","Noto Sans JP","Noto Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Droid Sans Fallback",sans-serif}
.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#04342C}.c-teal>.ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#412402}.c-amber>.ts{fill:#854F0B}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#26215C}.c-purple>.ts{fill:#534AB7}
.ng{stroke:#E24B4A;stroke-width:1.5;stroke-dasharray:5 5;fill:none}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="760" fill="#FFFFFF"/>
<circle class="c-gray" cx="100" cy="36" r="6" stroke-width="0.5"/>
<g class="c-gray"><rect x="40" y="60" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="83">依頼受付</text><text class="ts" x="52" y="99">requested</text></g>
<g class="c-teal"><rect x="40" y="145" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="168">写真査定済</text><text class="ts" x="52" y="184">photo_assessed</text></g>
<g class="c-teal"><rect x="40" y="230" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="253">本人確認済</text><text class="ts" x="52" y="269">identity_verified</text></g>
<g class="c-teal"><rect x="40" y="315" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="338">集荷手配済</text><text class="ts" x="52" y="354">pickup_scheduled</text></g>
<g class="c-teal"><rect x="40" y="400" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="423">倉庫到着</text><text class="ts" x="52" y="439">arrived</text></g>
<g class="c-amber"><rect x="40" y="485" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="508">検品済・合意待ち</text><text class="ts" x="52" y="524">inspected</text></g>
<g class="c-teal"><rect x="40" y="570" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="593">合意済</text><text class="ts" x="52" y="609">agreed</text></g>
<g class="c-purple"><rect x="40" y="655" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="52" y="678">送金済</text><text class="ts" x="52" y="694">paid</text></g>
<g class="c-gray"><rect x="280" y="230" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="292" y="253">キャンセル</text><text class="ts" x="292" y="269">canceled</text></g>
<g class="c-gray"><rect x="280" y="470" width="170" height="46" rx="4" stroke-width="0.5"/><text class="th" x="292" y="493">返送済</text><text class="ts" x="292" y="509">returned</text></g>
<line class="arr" x1="100" y1="44" x2="100" y2="58" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="106" x2="100" y2="143" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="191" x2="100" y2="228" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="276" x2="100" y2="313" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="361" x2="100" y2="398" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="446" x2="100" y2="483" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="531" x2="100" y2="568" marker-end="url(#arrow)"/>
<line class="arr" x1="100" y1="616" x2="100" y2="653" marker-end="url(#arrow)"/>
<line class="arr" x1="212" y1="253" x2="278" y2="253" marker-end="url(#arrow)"/>
<line class="arr" x1="212" y1="493" x2="278" y2="493" marker-end="url(#arrow)"/>
<path class="ng" d="M210 528 H500 V678 H212" marker-end="url(#arrow)"/>
<text class="ts" x="115" y="40">顧客が買取を申し込む</text>
<text class="ts" x="220" y="130">写真査定を確定</text>
<text class="ts" x="220" y="215">本人確認（古物営業法）</text>
<text class="ts" x="220" y="300">集荷を手配</text>
<text class="ts" x="220" y="385">倉庫に到着</text>
<text class="ts" x="220" y="465">実物検品で最終査定額を確定</text>
<text class="ts" x="220" y="545">顧客が合意（所有権が移る）</text>
<text class="ts" x="220" y="562">在庫を preparing で作成</text>
<text class="ts" x="220" y="640">Stripe で送金</text>
<text class="ts" x="462" y="253">集荷前ならいつでも取消</text>
<text class="ts" x="462" y="493">合意しない／期限超過</text>
<text class="ts" x="512" y="600" fill="#A32D2D">合意なしに送金不可</text>
<line class="arr" x1="40" y1="736" x2="70" y2="736"/>
<text class="ts" x="78" y="740">許可</text>
<line class="ng" x1="130" y1="736" x2="160" y2="736"/>
<text class="ts" x="168" y="740">禁止（実装しない）</text>
</svg>
